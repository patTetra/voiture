<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nav</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#14212F;--muted:#4F5A66;--route:#1F3A5F;--accent:#E8751A;--bg:#EEF0F2;--line:#C9CED4;--sh:0 .375rem 1.25rem rgba(20,33,47,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#map{position:absolute;inset:0;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible{outline:.1875rem solid var(--route);outline-offset:.125rem}
svg.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.card{background:#fff;box-shadow:var(--sh)}
.ui{position:absolute;z-index:10}

#banner{left:1.5rem;top:1.5rem;width:38rem;min-height:8rem;border-radius:1.5rem;overflow:hidden;display:none;align-items:center}
#banner .ic{width:8rem;align-self:stretch;min-height:8rem;flex-shrink:0;background:var(--route);color:#fff;display:flex;align-items:center;justify-content:center}
#banner .tx{padding:.875rem 1.25rem;min-width:0;display:flex;flex-direction:column;gap:.375rem}
.dl{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:.875rem}
#bdist{font-size:3.25rem;font-weight:700;line-height:1;letter-spacing:-.02em}
#btime{font-size:3.25rem;font-weight:700;line-height:1;letter-spacing:-.02em;white-space:nowrap}
#beta{font-size:1.125rem;font-weight:500;color:var(--muted);line-height:1}
#banner.flash{animation:bf .7s ease-in-out infinite}
#banner.flash #beta{color:#fff}
@keyframes bf{0%,100%{background:#fff;color:var(--ink)}50%{background:#E5352B;color:#fff}}
#bstreet{font-size:2.125rem;font-weight:700;color:inherit;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

#speed{right:1.5rem;top:1.5rem;height:6.5rem;padding:0 1.25rem;border-radius:1.75rem;display:none;align-items:center;gap:1rem;transition:background .2s,color .2s}
#speed .sv{display:flex;flex-direction:column;align-items:center;min-width:4.5rem}
#speed b{font-size:3rem;line-height:1}
#speed span{font-size:1rem;font-weight:500;color:var(--muted);margin-top:.25rem}
#lim{display:none;width:4.25rem;height:4.25rem;border-radius:50%;background:#fff;border:.4rem solid #D92D20;color:#111;align-items:center;justify-content:center;font-size:1.75rem;font-weight:800;box-sizing:border-box;flex-shrink:0}
#speed.over{background:#D92D20;color:#fff}
#speed.over span{color:#fff}
#speed.over #lim{border-color:#7A130B}

#bar{left:calc(50% - 17.5rem);bottom:1.5rem;width:35rem;height:5.5rem;border-radius:1.75rem;display:none;align-items:center;justify-content:space-between;padding:0 1rem 0 2rem}
#bar .s{display:flex;flex-direction:column;gap:.125rem}
#bar .s b{font-size:2.25rem;line-height:1;font-weight:700}
#bar .s span{font-size:1rem;font-weight:500;color:var(--muted)}
.ib{width:3.5rem;height:3.5rem;border-radius:1.125rem;background:var(--bg);display:flex;align-items:center;justify-content:center}
.ib.round{width:3rem;height:3rem;border-radius:50%;flex-shrink:0}

#rail{right:1.5rem;bottom:3.5rem;display:flex;flex-direction:column;gap:.75rem}
#rail button{width:4rem;height:4rem;border-radius:1.25rem;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
#rail button.act{background:var(--route);color:#fff}

#bmenu{right:6.5rem;bottom:3.5rem;display:none;flex-direction:column;gap:.375rem;padding:.625rem;border-radius:1.5rem}
#bmenu button{height:3.5rem;padding:0 1.5rem;border-radius:1rem;background:var(--bg);font-size:1.25rem;font-weight:600;text-align:left;white-space:nowrap}
#bmenu button[aria-pressed="true"]{background:var(--route);color:#fff}
#popen{left:1.5rem;top:1.5rem;width:4rem;height:4rem;border-radius:1.25rem;display:none;align-items:center;justify-content:center}

#panel{left:1.5rem;top:1.5rem;bottom:1.5rem;width:34rem;max-width:calc(100% - 3rem);border-radius:1.75rem;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;box-shadow:0 .625rem 2rem rgba(20,33,47,.18)}
#panel .ph{display:flex;align-items:center;justify-content:space-between}
#panel>*{flex-shrink:0}
.phb{display:flex;align-items:center;gap:.75rem}
#panel h1{margin:0;font-size:2rem;font-weight:700;letter-spacing:-.01em}
.favs{display:flex;flex-wrap:wrap;gap:.5rem}
.favs button{height:3.5rem;padding:0 1.25rem;border-radius:1.75rem;background:var(--bg);font-size:1.375rem;font-weight:600}
.fields{display:flex;align-items:center;gap:.75rem}
.fcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:.75rem}
.fld{display:flex;flex-direction:column;gap:.375rem}
.fld label{font-size:1rem;font-weight:500;color:var(--muted)}
.fld input{height:3.5rem;border:.125rem solid var(--line);border-radius:1rem;padding:0 1.125rem;font:inherit;font-size:1.5rem;font-weight:600;color:var(--ink);background:#fff;width:100%}
.fld input.on{border-color:var(--route)}
.inw{position:relative}
.inw input{padding-right:3.5rem}
.clr{position:absolute;right:.375rem;top:50%;transform:translateY(-50%);width:2.75rem;height:2.75rem;border-radius:50%;background:var(--bg);display:none;align-items:center;justify-content:center}
.addb{display:none;height:3.5rem;border-radius:1rem;border:.125rem dashed var(--line);color:var(--route);font-size:1.25rem;font-weight:600}
.stopbox{display:none;flex-direction:column;gap:.5rem}
.via .mv{width:2.75rem;height:2.75rem}
.vias{display:flex;flex-direction:column;gap:.25rem}
.via{display:flex;align-items:center;gap:.5rem;min-height:3.5rem;padding:0 .5rem 0 1.125rem;border:.125rem solid var(--line);border-radius:1rem;background:#fff;font-size:1.5rem;font-weight:600}
.via span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;font-size:1rem;font-weight:500;color:var(--muted)}
.vlab{font-size:1rem;font-weight:500;color:var(--muted);margin-top:.125rem}
.leg{display:flex;align-items:center;gap:.5rem;padding:.125rem 0 .125rem .25rem;font-size:1.125rem;font-weight:600;color:var(--muted)}
.fvg{display:flex;align-items:center;border-radius:1.5rem;background:var(--bg)}
.favs .fvg button{background:transparent}
.favs .fvg button:first-child{padding-right:.5rem}
.favs .fvg .x{width:3rem;padding:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#lpback{position:absolute;inset:0;z-index:24;display:none}
#lp{left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;width:30rem;max-width:calc(100% - 2rem);border-radius:1.75rem;padding:1.5rem;display:none;flex-direction:column;gap:1rem}
.lph{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
#lp h2{margin:0;font-size:1.5rem;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
#lp .sub{font-size:1rem;font-weight:500;color:var(--muted);margin-top:.25rem}
.lpact{display:flex;flex-direction:column;gap:.75rem}
.lpb{height:3.75rem;border-radius:1.125rem;background:var(--bg);font-size:1.375rem;font-weight:600;display:flex;align-items:center;gap:.875rem;padding:0 1.25rem;text-align:left}
.lpb.pri{background:var(--route);color:#fff}
.sugg{display:flex;flex-direction:column;gap:.25rem}
.sugg .hic{display:inline-flex;vertical-align:-.2rem;margin-right:.625rem;color:var(--muted)}
.sugg .hclr{min-height:3rem;font-size:1.0625rem;color:var(--muted);text-align:center;background:transparent}
.sugg button{min-height:4.25rem;padding:.625rem 1.25rem;border-radius:1rem;background:var(--bg);text-align:left;font-size:1.5rem;font-weight:500;line-height:1.2}
.routes{display:flex;flex-direction:column;gap:.75rem}
.rt{height:5rem;border:.125rem solid var(--line);border-radius:1.25rem;padding:0 1.25rem;background:#fff;display:flex;align-items:center;justify-content:space-between;text-align:left}
.rt.sel{border:.1875rem solid var(--route)}
.rt b{font-size:2.25rem;line-height:1;font-weight:700}
.rt .r{text-align:right;display:flex;flex-direction:column;gap:.125rem}
.rt .r span:first-child{font-size:1.25rem;font-weight:600}
.rt .r span:last-child{font-size:1rem;font-weight:500;color:var(--muted)}
.rt:not(.sel) b,.rt:not(.sel) .r span:first-child{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;min-height:3.25rem;font-size:1.25rem;font-weight:600}
.sw{width:4.5rem;height:2.5rem;border-radius:1.25rem;background:var(--line);padding:.25rem;display:flex;align-items:center;justify-content:flex-start}
.sw i{width:2rem;height:2rem;border-radius:50%;background:#fff;display:block}
.sw[aria-pressed="true"]{background:var(--route);justify-content:flex-end}
.go{margin-top:auto;height:4rem;border-radius:1.25rem;background:var(--route);color:#fff;font-size:1.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.75rem;flex-shrink:0}
.go:disabled{background:var(--line);color:var(--muted);cursor:default}

#toast{left:50%;top:1.5rem;transform:translateX(-50%);z-index:30;max-width:46rem;padding:.875rem 1.5rem;border-radius:1.5rem;background:var(--ink);color:#fff;font-size:1.25rem;font-weight:600;display:none;text-align:center}

body.nav #panel,body.nav #popen{display:none}
body.nav #banner,body.nav #bar,body.nav #speed{display:flex}
body.plan.collapsed #panel{display:none}
body.plan.collapsed #popen{display:flex}

.car{width:4rem;height:4rem;filter:drop-shadow(0 .375rem .5rem rgba(20,33,47,.35))}
.pin{width:3.5rem;height:4rem;filter:drop-shadow(0 .3rem .4rem rgba(20,33,47,.3))}
.maplibregl-ctrl-bottom-right{z-index:5}
</style>
</head>
<body class="plan">
<div id="map"></div>

<div id="banner" class="ui card" aria-live="polite">
  <div class="ic"><svg id="bic" class="i" width="76" height="76" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"></svg></div>
  <div class="tx"><div class="dl"><div id="bdist">–</div><div id="btime"></div></div><div id="beta"></div><div id="bstreet"></div></div>
</div>

<button id="popen" class="ui card" aria-label="Ouvrir l'itinéraire"><svg class="i" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button>

<div id="speed" class="ui card"><div class="sv"><b id="spd">0</b><span>km/h</span></div><div id="lim" aria-label="Vitesse maximale autorisée"></div></div>

<div id="bar" class="ui card">
  <div class="s"><b id="eta">--:--</b><span>arrivée</span></div>
  <div class="s"><b id="rest">–</b><span>restantes</span></div>
  <div class="s"><b id="km">–</b><span>à parcourir</span></div>
  <button id="stop" class="ib" aria-label="Arrêter la navigation"><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="bmenu" class="ui card" role="menu" aria-label="Fond de carte"></div>
<div id="rail" class="ui">
  <button id="b-center" aria-label="Recentrer sur ma position"><svg class="i" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button id="b-in" aria-label="Zoomer"><svg class="i" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="b-layers" aria-label="Fond de carte"><svg class="i" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></svg></button>
  <button id="b-out" aria-label="Dézoomer"><svg class="i" width="30" height="30" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"/></svg></button>
</div>

<aside id="panel" class="ui card" aria-label="Itinéraire">
  <div class="ph"><h1>Itinéraire</h1><div class="phb"><button id="swap" class="ib round" aria-label="Inverser départ et arrivée"><svg class="i" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M8 4v16M8 20l-3-3M8 20l3-3M16 20V4M16 4l-3 3M16 4l3 3"/></svg></button><button id="pclose" class="ib" aria-label="Replier le panneau"><svg class="i" width="24" height="24" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button></div></div>
  <div id="favs" class="favs"></div>
  <div class="fld"><label for="f-from">Départ</label><div class="inw"><input id="f-from" type="text" autocomplete="off" autocorrect="off" value="Ma position"><button id="c-from" class="clr" type="button" aria-label="Effacer le départ"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div id="vias" class="vias"></div>
  <div class="fld"><label for="f-to">Arrivée</label><div class="inw"><input id="f-to" type="text" autocomplete="off" autocorrect="off" placeholder="Adresse ou lieu"><button id="c-to" class="clr" type="button" aria-label="Effacer l'arrivée"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
  <div id="sugg" class="sugg"></div>
  <button id="addstop" class="addb" type="button">+ Ajouter une étape</button>
  <div id="stopbox" class="stopbox"><div class="fld"><label for="f-via">Nouvelle étape</label><div class="inw"><input id="f-via" type="text" autocomplete="off" autocorrect="off" placeholder="Adresse ou lieu"><button id="c-via" class="clr" type="button" aria-label="Annuler l’étape"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div id="vsugg" class="sugg"></div></div>
  <div id="routes" class="routes"></div>
  <div class="row"><span>Mode moto<small>sans autoroute, péage ni voie rapide</small></span><button id="motog" class="sw" type="button" aria-pressed="false" aria-label="Mode moto, sans autoroute, péage ni voie rapide"><i></i></button></div>
  <button id="go" class="go" disabled><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Démarrer</button>
</aside>

<div id="lpback"></div>
<div id="lp" class="ui card" role="dialog" aria-label="Point sur la carte">
  <div class="lph">
    <div style="min-width:0"><h2 id="lptitle">Point sur la carte</h2><div id="lpsub" class="sub"></div></div>
    <button id="lp-x" class="ib round" type="button" aria-label="Fermer"><svg class="i" width="22" height="22" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div id="lpact" class="lpact">
    <button id="lp-via" class="lpb" type="button"><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Ajouter comme étape</span></button>
    <button id="lp-dest" class="lpb" type="button"><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span id="lp-dest-t">Y aller</span></button>
    <button id="lp-fav" class="lpb" type="button"><svg class="i" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg><span>Mettre en favori</span></button>
  </div>
  <div id="lpfavrow" class="lpact" style="display:none">
    <div class="fld"><label for="lpname">Nom du favori</label><input id="lpname" type="text" autocomplete="off"></div>
    <button id="lp-save" class="go" type="button" style="margin-top:0">Enregistrer</button>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="config.js"></script>

(function () {
'use strict';

/* ---------- Réglages ---------- */
var RELAY = 'https://nav.tetra2922.workers.dev';
var CFG = window.NAV_CONFIG || {};
var FAVORIS = Array.isArray(CFG.favoris) ? CFG.favoris : [];

/* ---------- Utilitaires ---------- */
var $ = function (id) { return document.getElementById(id); };

  return 6371008.8 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
function brg(a, b) {

  var x = Math.cos(a[1] * rad) * Math.sin(b[1] * rad) - Math.sin(a[1] * rad) * Math.cos(b[1] * rad) * Math.cos((b[0] - a[0]) * rad);
  return (Math.atan2(y, x) / rad + 360) % 360;
}
function smooth(a, b) { var d = ((b - a + 540) % 360) - 180; return (a + d * 0.5 + 360) % 360; }
function fmtDist(m) {

}
function fmtKm(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km'; }
function fmtDur(s) {
  var m = Math.max(1, Math.round(s / 60));

}
function fmtShort(s) {
  if (s == null || isNaN(s)) return '';

}
function fmtTime(d) { return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function toast(msg, ms) {

  clearTimeout(toastTimer);

}

/* ---------- Icônes ---------- */

  right: '<path d="M6 21V12a5 5 0 0 1 5-5h9"/><path d="M16 3l4 4-4 4"/>',
  sleft: '<path d="M12 21v-8l-6-6"/><path d="M11 7H6v5"/>',
  sright: '<path d="M12 21v-8l6-6"/><path d="M13 7h5v5"/>',

};

var S = {

  var c = r.coords, cum = r.cum, i = 0;
  while (i < c.length - 2 && cum[i + 1] < d) i++;
  var seg = cum[i + 1] - cum[i] || 1, t = Math.max(0, Math.min(1, (d - cum[i]) / seg));
  return { p: [c[i][0] + (c[i + 1][0] - c[i][0]) * t, c[i][1] + (c[i + 1][1] - c[i][1]) * t], h: brg(c[i], c[i + 1]) };
}
function startSim() {
  stopSim(); simDist = 0;
  simTimer = setInterval(function () {
    if (!S.route) return;
    simDist = Math.min(S.route.total, simDist + 14);
    var q = pointAt(S.route, simDist);
    S.pos = q.p; S.heading = q.h; S.speed = 50;
    onFix();
  }, 1000);
}
function stopSim() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

/* ---------- Démarrage ---------- */
if (SIM) toast('Mode simulation : le trajet défile tout seul après « Démarrer ».', 6000);
startGeo();
})();
</script>
